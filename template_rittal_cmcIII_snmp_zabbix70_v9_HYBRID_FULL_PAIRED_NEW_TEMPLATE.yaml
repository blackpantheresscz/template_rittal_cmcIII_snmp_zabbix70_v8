  - uuid: eeb9b617453e44b7b3c2a331d15559a3
    template: Template Rittal CMC III SNMP - Hybrid Full Paired Test
    name: Template Rittal CMC III SNMP - Hybrid Full Paired Test
    description: 'Rittal CMC III SNMP template test. Uses device-table discovery for
      readable paired item names like {#DEVALIAS}: Temperature.Value, Access.Status,
      Handle.Status. This avoids generic variable table names with duplicate labels.


      V9 hybrid: keeps clean paired device-name items, and adds raw full variable
      discovery for *.Value and *.Status to avoid losing data on device types not
      explicitly modeled.'
    groups:
    - name: Templates/Environmental
    items:
    - uuid: 93f49055e13542c89fff21b66dc98649
      name: 'CMC III: Unit status'
      type: SNMP_AGENT
      snmp_oid: .1.3.6.1.4.1.2606.7.2.1.0
      key: rittal.cmc.unit.status
      delay: 1m
      history: 30d
      trends: '0'
      value_type: UNSIGNED
      triggers:
      - uuid: 48e9293c68014bd2aa673ac45589ab07
        expression: last(/Template Rittal CMC III SNMP - Hybrid Full Paired Test/rittal.cmc.unit.status)<>1
        name: 'CMC III: Unit status is not OK'
        priority: HIGH
    - uuid: f21b57282da240b4b79cfc18f2d0691f
