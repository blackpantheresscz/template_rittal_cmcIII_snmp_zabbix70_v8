    - uuid: 09dd642b1bfc41249b94aa0ee9223a4a
      name: 'CMC III RAW: Numeric variable discovery - fallback'
      type: SNMP_AGENT
      snmp_oid: discovery[{#VARNAME},.1.3.6.1.4.1.2606.7.4.2.2.1.3,{#VARUNIT},.1.3.6.1.4.1.2606.7.4.2.2.1.5,{#VARSCALE},.1.3.6.1.4.1.2606.7.4.2.2.1.7]
      key: rittal.cmc.raw.var.numeric.discovery
      delay: 1h
      lifetime: 7d
      filter:
        evaltype: AND
        conditions:
        - macro: '{#VARNAME}'
          value: ^.*\.Value$
          operator: MATCHES_REGEX
          formulaid: A
      item_prototypes:
      - uuid: 5d986666512a4054b3e8ad8483f8dc7d
        name: 'CMC III RAW: [{#SNMPINDEX}] {#VARNAME}'
        type: SNMP_AGENT
        snmp_oid: .1.3.6.1.4.1.2606.7.4.2.2.1.11.{#SNMPINDEX}
        key: rittal.cmc.raw.var.value[{#SNMPINDEX}]
        delay: 1m
        history: 30d
        trends: 365d
        value_type: FLOAT
        units: '{#VARUNIT}'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var scale = Number(''{#VARSCALE}'');

            if (scale < 0) return Number(value) / Math.abs(scale);

            return Number(value) * scale;'
        tags:
        - tag: component
          value: rittal_raw
