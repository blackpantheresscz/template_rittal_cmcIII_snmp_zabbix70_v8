zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 59c3a5e55fd042f49f43c310a6edc0fd
    name: Templates/Environmental
  templates:
  - uuid: 7295d554975f40f1af30d62900c0bb7f
    template: Template Rittal CMC III SNMP - Paired Names Test
    name: Template Rittal CMC III SNMP - Paired Names Test
    description: 'Rittal CMC III SNMP template test. Uses device-table discovery for
      readable paired item names like {#DEVALIAS}: Temperature.Value, Access.Status,
      Handle.Status. This avoids generic variable table names with duplicate labels.'
    groups:
    - name: Templates/Environmental
    items:
    - uuid: b8c4e22fd6594784abc90d33a3e4b40d
      name: 'CMC III: Unit status'
      type: SNMP_AGENT
      snmp_oid: .1.3.6.1.4.1.2606.7.2.1.0
      key: rittal.cmc.unit.status
      delay: 1m
      history: 30d
      trends: '0'
      value_type: UNSIGNED
      triggers:
      - uuid: b78f68ece14e4d1fa5ca25eff125c29c
        expression: last(/Template Rittal CMC III SNMP - Paired Names Test/rittal.cmc.unit.status)<>1
        name: 'CMC III: Unit status is not OK'
        priority: HIGH
    - uuid: cadd6b5f49744b159f9ce34650abd445
      name: 'CMC III: Firmware version'
      type: SNMP_AGENT
      snmp_oid: .1.3.6.1.4.1.2606.7.2.4.0
      key: rittal.cmc.unit.firmware
      delay: 1h
      history: 30d
      trends: '0'
      value_type: CHAR
    - uuid: edcec3b5f92b43a7a6dd97c4da1992af
      name: 'CMC III: OS version'
      type: SNMP_AGENT
      snmp_oid: .1.3.6.1.4.1.2606.7.2.5.0
      key: rittal.cmc.unit.os
      delay: 1h
      history: 30d
      trends: '0'
      value_type: CHAR
    - uuid: d2ff8c0c79e044a88f8ce6f2c9c1f718
      name: 'CMC III: Serial number'
      type: SNMP_AGENT
      snmp_oid: .1.3.6.1.4.1.2606.7.2.6.0
      key: rittal.cmc.unit.serial
      delay: 1h
      history: 30d
      trends: '0'
      value_type: CHAR
    - uuid: 1dea17dc44324e2d8fbf27819d50e512
      name: 'CMC III: URL'
      type: SNMP_AGENT
      snmp_oid: .1.3.6.1.4.1.2606.7.2.2.0
      key: rittal.cmc.unit.url
      delay: 1h
      history: 30d
      trends: '0'
      value_type: CHAR
    - uuid: 85e89ef4d7854b528e835dcbef862937
      name: 'CMC III: Unit uptime'
      type: SNMP_AGENT
      snmp_oid: .1.3.6.1.4.1.2606.7.2.12.0
      key: rittal.cmc.unit.uptime
      delay: 5m
      history: 30d
      trends: 365d
      value_type: UNSIGNED
